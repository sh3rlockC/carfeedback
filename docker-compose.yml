services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./ops/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${JOB_ARTIFACTS_HOST_PATH:-./storage/jobs}:/srv/koubei/jobs:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: ./ops/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/car-user-feedback}
        NEXT_PUBLIC_ACCESS_CONTROL_ENABLED: ${NEXT_PUBLIC_ACCESS_CONTROL_ENABLED:-false}
    environment:
      PORT: 3000
      NODE_ENV: production
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://api:8000}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/car-user-feedback}
      NEXT_PUBLIC_ACCESS_CONTROL_ENABLED: ${NEXT_PUBLIC_ACCESS_CONTROL_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const base = process.env.NEXT_PUBLIC_BASE_PATH || ''; fetch('http://127.0.0.1:3000' + base + '/passphrase').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ./ops/docker/api.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      BASE_URL: ${BASE_URL:-http://localhost}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://koubei:koubei@postgres:5432/koubei}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/srv/koubei/jobs}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspace}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-vehicle-koubei-temporal}
      WORKER_JOB_TIMEOUT_SECONDS: ${WORKER_JOB_TIMEOUT_SECONDS:-3600}
      VEHICLE_RESOLVE_CACHE_TTL_SECONDS: ${VEHICLE_RESOLVE_CACHE_TTL_SECONDS:-604800}
      VEHICLE_RESOLVE_PLATFORM_TIMEOUT_SECONDS: ${VEHICLE_RESOLVE_PLATFORM_TIMEOUT_SECONDS:-60}
      JOB_ARTIFACT_RETENTION_DAYS: ${JOB_ARTIFACT_RETENTION_DAYS:-3}
      JOB_ARTIFACT_CLEANUP_INTERVAL_SECONDS: ${JOB_ARTIFACT_CLEANUP_INTERVAL_SECONDS:-43200}
      ACCESS_CONTROL_ENABLED: ${ACCESS_CONTROL_ENABLED:-false}
      PASS_PHRASE_HASH: ${PASS_PHRASE_HASH:-}
      PASS_PHRASE_VERSION: ${PASS_PHRASE_VERSION:-2026-W17}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL_REPORT: ${LLM_MODEL_REPORT:-deepseek-v4-pro}
      LLM_MODEL_QA: ${LLM_MODEL_QA:-deepseek-v4-pro}
      OPENCLAW_AUTOHOME_AGENT_IDS: ${OPENCLAW_AUTOHOME_AGENT_IDS:-autohome-1,autohome-2,autohome-3,autohome-4}
      OPENCLAW_DCD_AGENT_IDS: ${OPENCLAW_DCD_AGENT_IDS:-dongchedi-1,dongchedi-2,dongchedi-3,dongchedi-4}
    volumes:
      - ${JOB_ARTIFACTS_HOST_PATH:-./storage/jobs}:/srv/koubei/jobs
      - ..:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: ./ops/docker/worker.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://koubei:koubei@postgres:5432/koubei}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/srv/koubei/jobs}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspace}
      WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME:-vehicle-koubei}
      JOB_ARTIFACT_RETENTION_DAYS: ${JOB_ARTIFACT_RETENTION_DAYS:-3}
      JOB_ARTIFACT_CLEANUP_INTERVAL_SECONDS: ${JOB_ARTIFACT_CLEANUP_INTERVAL_SECONDS:-43200}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL_BATCH: ${LLM_MODEL_BATCH:-deepseek-v4-flash}
      LLM_MODEL_REPORT: ${LLM_MODEL_REPORT:-deepseek-v4-pro}
      LLM_MODEL_QA: ${LLM_MODEL_QA:-deepseek-v4-pro}
      HERMES_COMMAND: ${HERMES_COMMAND:-hermes}
      HERMES_LLM_MODE: ${HERMES_LLM_MODE:-api}
      HERMES_BATCH_CONCURRENCY: ${HERMES_BATCH_CONCURRENCY:-3}
      HERMES_BATCH_TARGET_BYTES: ${HERMES_BATCH_TARGET_BYTES:-45000}
      HERMES_TIMEOUT_SECONDS: ${HERMES_TIMEOUT_SECONDS:-180}
      HERMES_AGGREGATE_TIMEOUT_SECONDS: ${HERMES_AGGREGATE_TIMEOUT_SECONDS:-180}
      HERMES_JSON_RETRIES: ${HERMES_JSON_RETRIES:-1}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-vehicle-koubei-temporal}
      AUTOHOME_COLLECTOR_SERVICE_URL: ${AUTOHOME_COLLECTOR_SERVICE_URL:-http://autohome-collector:8100}
      DCD_COLLECTOR_SERVICE_URL: ${DCD_COLLECTOR_SERVICE_URL:-http://dongchedi-collector:8100}
      COLLECTOR_WAIT_TIMEOUT_SECONDS: ${COLLECTOR_WAIT_TIMEOUT_SECONDS:-2400}
      COLLECTOR_WAIT_POLL_SECONDS: ${COLLECTOR_WAIT_POLL_SECONDS:-5}
      COLLECTOR_PROGRESS_STALL_TIMEOUT_SECONDS: ${COLLECTOR_PROGRESS_STALL_TIMEOUT_SECONDS:-900}
      OPENCLAW_MAX_ACTIVE_COLLECTIONS: ${OPENCLAW_MAX_ACTIVE_COLLECTIONS:-2}
      OPENCLAW_BURST_ACTIVE_COLLECTIONS: ${OPENCLAW_BURST_ACTIVE_COLLECTIONS:-3}
      OPENCLAW_MIN_MEM_AVAILABLE_MB: ${OPENCLAW_MIN_MEM_AVAILABLE_MB:-3000}
      OPENCLAW_BURST_MIN_MEM_AVAILABLE_MB: ${OPENCLAW_BURST_MIN_MEM_AVAILABLE_MB:-4000}
      OPENCLAW_MAX_SWAP_USED_MB: ${OPENCLAW_MAX_SWAP_USED_MB:-512}
      OPENCLAW_BROWSER_ARGS: ${OPENCLAW_BROWSER_ARGS:---no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --disable-background-networking --disable-sync --mute-audio --no-first-run --no-default-browser-check --renderer-process-limit=4}
      OPENCLAW_AUTOHOME_BLOCK_RESOURCE_TYPES: ${OPENCLAW_AUTOHOME_BLOCK_RESOURCE_TYPES:-image,media,font}
      OPENCLAW_DCD_BLOCK_RESOURCE_TYPES: ${OPENCLAW_DCD_BLOCK_RESOURCE_TYPES:-}
      OPENCLAW_AUTOHOME_AGENT_IDS: ${OPENCLAW_AUTOHOME_AGENT_IDS:-autohome-1,autohome-2,autohome-3,autohome-4}
      OPENCLAW_DCD_AGENT_IDS: ${OPENCLAW_DCD_AGENT_IDS:-dongchedi-1,dongchedi-2,dongchedi-3,dongchedi-4}
      OPENCLAW_AGENT_LEASE_SECONDS: ${OPENCLAW_AGENT_LEASE_SECONDS:-2400}
      OPENCLAW_AGENT_POOL_WAIT_SECONDS: ${OPENCLAW_AGENT_POOL_WAIT_SECONDS:-1800}
      SINGLE_TASK_PRIORITY_WEIGHT: ${SINGLE_TASK_PRIORITY_WEIGHT:-0.1}
      CROWDED_WAIT_SECONDS: ${CROWDED_WAIT_SECONDS:-300}
      TEMPORAL_REAL_SINGLE_TASK_PIPELINE_ENABLED: ${TEMPORAL_REAL_SINGLE_TASK_PIPELINE_ENABLED:-false}
      WORDCLOUD_FONT_PATH: ${WORDCLOUD_FONT_PATH:-/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc}
    volumes:
      - ${JOB_ARTIFACTS_HOST_PATH:-./storage/jobs}:/srv/koubei/jobs
      - ..:/workspace:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; from redis import Redis; Redis.from_url(os.environ['REDIS_URL']).ping()\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  temporal-worker:
    build:
      context: .
      dockerfile: ./ops/docker/worker.Dockerfile
    command: ["python", "temporal_worker.py"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://koubei:koubei@postgres:5432/koubei}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/srv/koubei/jobs}
      CORPUS_ROOT: ${CORPUS_ROOT:-/srv/koubei/corpus}
      KOUBEI_CORPUS_ROOT: ${CORPUS_ROOT:-/srv/koubei/corpus}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspace}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-vehicle-koubei-temporal}
      AUTOHOME_COLLECTOR_SERVICE_URL: ${AUTOHOME_COLLECTOR_SERVICE_URL:-http://autohome-collector:8100}
      DCD_COLLECTOR_SERVICE_URL: ${DCD_COLLECTOR_SERVICE_URL:-http://dongchedi-collector:8100}
      COLLECTOR_WAIT_TIMEOUT_SECONDS: ${COLLECTOR_WAIT_TIMEOUT_SECONDS:-2400}
      COLLECTOR_WAIT_POLL_SECONDS: ${COLLECTOR_WAIT_POLL_SECONDS:-5}
      COLLECTOR_PROGRESS_STALL_TIMEOUT_SECONDS: ${COLLECTOR_PROGRESS_STALL_TIMEOUT_SECONDS:-900}
      OPENCLAW_MAX_ACTIVE_COLLECTIONS: ${OPENCLAW_MAX_ACTIVE_COLLECTIONS:-2}
      OPENCLAW_BURST_ACTIVE_COLLECTIONS: ${OPENCLAW_BURST_ACTIVE_COLLECTIONS:-3}
      OPENCLAW_MIN_MEM_AVAILABLE_MB: ${OPENCLAW_MIN_MEM_AVAILABLE_MB:-3000}
      OPENCLAW_BURST_MIN_MEM_AVAILABLE_MB: ${OPENCLAW_BURST_MIN_MEM_AVAILABLE_MB:-4000}
      OPENCLAW_MAX_SWAP_USED_MB: ${OPENCLAW_MAX_SWAP_USED_MB:-512}
      OPENCLAW_BROWSER_ARGS: ${OPENCLAW_BROWSER_ARGS:---no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --disable-background-networking --disable-sync --mute-audio --no-first-run --no-default-browser-check --renderer-process-limit=4}
      OPENCLAW_AUTOHOME_BLOCK_RESOURCE_TYPES: ${OPENCLAW_AUTOHOME_BLOCK_RESOURCE_TYPES:-image,media,font}
      OPENCLAW_DCD_BLOCK_RESOURCE_TYPES: ${OPENCLAW_DCD_BLOCK_RESOURCE_TYPES:-}
      OPENCLAW_AUTOHOME_AGENT_IDS: ${OPENCLAW_AUTOHOME_AGENT_IDS:-autohome-1,autohome-2,autohome-3,autohome-4}
      OPENCLAW_DCD_AGENT_IDS: ${OPENCLAW_DCD_AGENT_IDS:-dongchedi-1,dongchedi-2,dongchedi-3,dongchedi-4}
      OPENCLAW_AGENT_LEASE_SECONDS: ${OPENCLAW_AGENT_LEASE_SECONDS:-2400}
      OPENCLAW_AGENT_POOL_WAIT_SECONDS: ${OPENCLAW_AGENT_POOL_WAIT_SECONDS:-1800}
      SINGLE_TASK_PRIORITY_WEIGHT: ${SINGLE_TASK_PRIORITY_WEIGHT:-0.1}
      CROWDED_WAIT_SECONDS: ${CROWDED_WAIT_SECONDS:-300}
      TEMPORAL_REAL_SINGLE_TASK_PIPELINE_ENABLED: ${TEMPORAL_REAL_SINGLE_TASK_PIPELINE_ENABLED:-false}
      COMPARISON_MODEL_CONCURRENCY: ${COMPARISON_MODEL_CONCURRENCY:-2}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL_BATCH: ${LLM_MODEL_BATCH:-deepseek-v4-flash}
      LLM_MODEL_REPORT: ${LLM_MODEL_REPORT:-deepseek-v4-pro}
      LLM_MODEL_QA: ${LLM_MODEL_QA:-deepseek-v4-pro}
      HERMES_COMMAND: ${HERMES_COMMAND:-hermes}
      HERMES_LLM_MODE: ${HERMES_LLM_MODE:-api}
      HERMES_BATCH_CONCURRENCY: ${HERMES_BATCH_CONCURRENCY:-3}
      HERMES_BATCH_TARGET_BYTES: ${HERMES_BATCH_TARGET_BYTES:-45000}
      HERMES_TIMEOUT_SECONDS: ${HERMES_TIMEOUT_SECONDS:-180}
      HERMES_AGGREGATE_TIMEOUT_SECONDS: ${HERMES_AGGREGATE_TIMEOUT_SECONDS:-180}
      HERMES_JSON_RETRIES: ${HERMES_JSON_RETRIES:-1}
      WORDCLOUD_FONT_PATH: ${WORDCLOUD_FONT_PATH:-/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc}
    volumes:
      - ${JOB_ARTIFACTS_HOST_PATH:-./storage/jobs}:/srv/koubei/jobs
      - ${CORPUS_HOST_PATH:-./storage/corpus}:/srv/koubei/corpus
      - ..:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      autohome-collector:
        condition: service_healthy
      dongchedi-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import asyncio, os; from temporalio.client import Client; asyncio.run(Client.connect(os.environ['TEMPORAL_ADDRESS'], namespace=os.environ.get('TEMPORAL_NAMESPACE', 'default')))\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  autohome-collector:
    build:
      context: .
      dockerfile: ./ops/docker/collector-service.Dockerfile
    environment:
      COLLECTOR_PLATFORM: autohome
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://koubei:koubei@postgres:5432/koubei}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/srv/koubei/jobs}
      CORPUS_ROOT: ${CORPUS_ROOT:-/srv/koubei/corpus}
      KOUBEI_CORPUS_ROOT: ${CORPUS_ROOT:-/srv/koubei/corpus}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspace}
      OPENCLAW_ADAPTER_ENABLED: ${OPENCLAW_ADAPTER_ENABLED:-true}
      OPENCLAW_ADAPTER_STAGES: ${OPENCLAW_ADAPTER_STAGES:-collecting_autohome,collecting_dcd}
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL:-ws://host.docker.internal:18790}
      OPENCLAW_GATEWAY_TOKEN_FILE: ${OPENCLAW_GATEWAY_TOKEN_FILE:-/run/secrets/openclaw_gateway_token}
      OPENCLAW_AGENT_ID: ${OPENCLAW_AGENT_ID:-main}
      OPENCLAW_AUTOHOME_AGENT_IDS: ${OPENCLAW_AUTOHOME_AGENT_IDS:-autohome-1,autohome-2,autohome-3,autohome-4}
      OPENCLAW_DCD_AGENT_IDS: ${OPENCLAW_DCD_AGENT_IDS:-dongchedi-1,dongchedi-2,dongchedi-3,dongchedi-4}
      OPENCLAW_TIMEOUT_SECONDS: ${OPENCLAW_TIMEOUT_SECONDS:-1800}
      OPENCLAW_ARTIFACT_POLL_INTERVAL_SECONDS: ${OPENCLAW_ARTIFACT_POLL_INTERVAL_SECONDS:-5}
      COLLECTOR_SERVICE_RESOURCE_GUARD_ENABLED: ${COLLECTOR_SERVICE_RESOURCE_GUARD_ENABLED:-true}
      OPENCLAW_MAX_ACTIVE_COLLECTIONS: ${OPENCLAW_MAX_ACTIVE_COLLECTIONS:-2}
      OPENCLAW_BURST_ACTIVE_COLLECTIONS: ${OPENCLAW_BURST_ACTIVE_COLLECTIONS:-3}
      OPENCLAW_MIN_MEM_AVAILABLE_MB: ${OPENCLAW_MIN_MEM_AVAILABLE_MB:-3000}
      OPENCLAW_BURST_MIN_MEM_AVAILABLE_MB: ${OPENCLAW_BURST_MIN_MEM_AVAILABLE_MB:-4000}
      OPENCLAW_MAX_SWAP_USED_MB: ${OPENCLAW_MAX_SWAP_USED_MB:-512}
      OPENCLAW_BROWSER_ARGS: ${OPENCLAW_BROWSER_ARGS:---no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --disable-background-networking --disable-sync --mute-audio --no-first-run --no-default-browser-check --renderer-process-limit=4}
      OPENCLAW_AUTOHOME_BLOCK_RESOURCE_TYPES: ${OPENCLAW_AUTOHOME_BLOCK_RESOURCE_TYPES:-image,media,font}
      OPENCLAW_DCD_BLOCK_RESOURCE_TYPES: ${OPENCLAW_DCD_BLOCK_RESOURCE_TYPES:-}
      OPENCLAW_COLLECTOR_SKILL: ${OPENCLAW_COLLECTOR_SKILL:-sh3rlockC/auto-koubei-collector}
      OPENCLAW_AUTOHOME_COLLECTOR_SKILL: ${OPENCLAW_AUTOHOME_COLLECTOR_SKILL:-sh3rlockC/auto-koubei-collector}
      OPENCLAW_DCD_COLLECTOR_SKILL: ${OPENCLAW_DCD_COLLECTOR_SKILL:-sh3rlockC/dcd-koubei-collector}
      OPENCLAW_ARTIFACT_ROOT_HOST: ${OPENCLAW_ARTIFACT_ROOT_HOST:-}
      OPENCLAW_TASK_DB_PATH: ${OPENCLAW_TASK_DB_PATH:-/openclaw-state/tasks/runs.sqlite}
      OPENCLAW_DEVICE_IDENTITY_FILE: ${OPENCLAW_DEVICE_IDENTITY_FILE:-/openclaw-state/identity/device.json}
    volumes:
      - ${JOB_ARTIFACTS_HOST_PATH:-./storage/jobs}:/srv/koubei/jobs
      - ${CORPUS_HOST_PATH:-./storage/corpus}:/srv/koubei/corpus
      - ..:/workspace:ro
      - ${OPENCLAW_STATE_HOST_PATH:-./ops/openclaw-state-placeholder}:/openclaw-state:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - openclaw_gateway_token
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dongchedi-collector:
    build:
      context: .
      dockerfile: ./ops/docker/collector-service.Dockerfile
    environment:
      COLLECTOR_PLATFORM: dongchedi
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://koubei:koubei@postgres:5432/koubei}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/srv/koubei/jobs}
      CORPUS_ROOT: ${CORPUS_ROOT:-/srv/koubei/corpus}
      KOUBEI_CORPUS_ROOT: ${CORPUS_ROOT:-/srv/koubei/corpus}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspace}
      OPENCLAW_ADAPTER_ENABLED: ${OPENCLAW_ADAPTER_ENABLED:-true}
      OPENCLAW_ADAPTER_STAGES: ${OPENCLAW_ADAPTER_STAGES:-collecting_autohome,collecting_dcd}
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL:-ws://host.docker.internal:18790}
      OPENCLAW_GATEWAY_TOKEN_FILE: ${OPENCLAW_GATEWAY_TOKEN_FILE:-/run/secrets/openclaw_gateway_token}
      OPENCLAW_AGENT_ID: ${OPENCLAW_AGENT_ID:-main}
      OPENCLAW_AUTOHOME_AGENT_IDS: ${OPENCLAW_AUTOHOME_AGENT_IDS:-autohome-1,autohome-2,autohome-3,autohome-4}
      OPENCLAW_DCD_AGENT_IDS: ${OPENCLAW_DCD_AGENT_IDS:-dongchedi-1,dongchedi-2,dongchedi-3,dongchedi-4}
      OPENCLAW_TIMEOUT_SECONDS: ${OPENCLAW_TIMEOUT_SECONDS:-1800}
      OPENCLAW_ARTIFACT_POLL_INTERVAL_SECONDS: ${OPENCLAW_ARTIFACT_POLL_INTERVAL_SECONDS:-5}
      COLLECTOR_SERVICE_RESOURCE_GUARD_ENABLED: ${COLLECTOR_SERVICE_RESOURCE_GUARD_ENABLED:-true}
      OPENCLAW_MAX_ACTIVE_COLLECTIONS: ${OPENCLAW_MAX_ACTIVE_COLLECTIONS:-2}
      OPENCLAW_BURST_ACTIVE_COLLECTIONS: ${OPENCLAW_BURST_ACTIVE_COLLECTIONS:-3}
      OPENCLAW_MIN_MEM_AVAILABLE_MB: ${OPENCLAW_MIN_MEM_AVAILABLE_MB:-3000}
      OPENCLAW_BURST_MIN_MEM_AVAILABLE_MB: ${OPENCLAW_BURST_MIN_MEM_AVAILABLE_MB:-4000}
      OPENCLAW_MAX_SWAP_USED_MB: ${OPENCLAW_MAX_SWAP_USED_MB:-512}
      OPENCLAW_BROWSER_ARGS: ${OPENCLAW_BROWSER_ARGS:---no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --disable-background-networking --disable-sync --mute-audio --no-first-run --no-default-browser-check --renderer-process-limit=4}
      OPENCLAW_AUTOHOME_BLOCK_RESOURCE_TYPES: ${OPENCLAW_AUTOHOME_BLOCK_RESOURCE_TYPES:-image,media,font}
      OPENCLAW_DCD_BLOCK_RESOURCE_TYPES: ${OPENCLAW_DCD_BLOCK_RESOURCE_TYPES:-}
      OPENCLAW_COLLECTOR_SKILL: ${OPENCLAW_COLLECTOR_SKILL:-sh3rlockC/auto-koubei-collector}
      OPENCLAW_AUTOHOME_COLLECTOR_SKILL: ${OPENCLAW_AUTOHOME_COLLECTOR_SKILL:-sh3rlockC/auto-koubei-collector}
      OPENCLAW_DCD_COLLECTOR_SKILL: ${OPENCLAW_DCD_COLLECTOR_SKILL:-sh3rlockC/dcd-koubei-collector}
      OPENCLAW_ARTIFACT_ROOT_HOST: ${OPENCLAW_ARTIFACT_ROOT_HOST:-}
      OPENCLAW_TASK_DB_PATH: ${OPENCLAW_TASK_DB_PATH:-/openclaw-state/tasks/runs.sqlite}
      OPENCLAW_DEVICE_IDENTITY_FILE: ${OPENCLAW_DEVICE_IDENTITY_FILE:-/openclaw-state/identity/device.json}
    volumes:
      - ${JOB_ARTIFACTS_HOST_PATH:-./storage/jobs}:/srv/koubei/jobs
      - ${CORPUS_HOST_PATH:-./storage/corpus}:/srv/koubei/corpus
      - ..:/workspace:ro
      - ${OPENCLAW_STATE_HOST_PATH:-./ops/openclaw-state-placeholder}:/openclaw-state:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - openclaw_gateway_token
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-koubei}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-koubei}
      DBNAME: ${TEMPORAL_DBNAME:-temporal}
      VISIBILITY_DBNAME: ${TEMPORAL_VISIBILITY_DBNAME:-temporal_visibility}
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address \"$${TEMPORAL_ADDRESS:-temporal:7233}\" --namespace \"$${TEMPORAL_NAMESPACE:-default}\" --command-timeout 5s >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-koubei}
      POSTGRES_USER: ${POSTGRES_USER:-koubei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koubei}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-koubei} -d ${POSTGRES_DB:-koubei}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

secrets:
  openclaw_gateway_token:
    file: ${OPENCLAW_GATEWAY_TOKEN_FILE_HOST:-./ops/secrets/openclaw_gateway_token.placeholder}
