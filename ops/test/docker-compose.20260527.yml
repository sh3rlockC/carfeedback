    environment:
      APP_ENV: production
      WORKER_QUEUE_NAME: vehicle-koubei-20260527
      TEMPORAL_TASK_QUEUE: vehicle-koubei-temporal-20260527
      TASK_CENTER_CREATE_ENABLED: "true"

  worker:
    environment:
